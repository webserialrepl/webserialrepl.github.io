name: Deploy develop to GitHub Pages

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build develop version
        run: npm run build -- --mode develop

      - name: Move dist to develop folder
        run: |
          mkdir deploy
          mkdir deploy/develop
          cp -r dist/* deploy/develop/

      - name: Deploy to gh-pages (develop/)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./deploy
          keep_files: true
