name: Deploy develop to GitHub Pages

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (develop mode)
        run: npm run build:dev

      # ビルド済みの dist フォルダを deploy/develop にコピー
      - name: Move dist to develop folder
        run: |
          mkdir -p deploy/develop
          cp -r dist/* deploy/develop/

      # デプロイを実行
      - name: Deploy to gh-pages (develop/)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./deploy
          keep_files: true