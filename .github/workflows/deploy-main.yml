name: Deploy main to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v3

      # すでにリポジトリ内にある dist フォルダをそのままルート直下にデプロイ
      - name: Deploy to gh-pages (root)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist  # 👈 dist フォルダの中身をそのまま公開
          keep_files: true     # 👈 これにより、develop/ フォルダが消されずに残ります