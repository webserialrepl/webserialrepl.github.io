<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MicroPython WebSerial REPL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/dist/themes/light.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.28.1/min/vs/editor/editor.main.min.css">

  <style>
    body {
      padding: 0;
      margin: 0;
    }
    * {
      box-sizing: border-box;
    }
    #terminal {
      height: 14em; /* 14行分の高さ（1行分減らす） */
      overflow-y: auto; /* 縦方向のスクロールを有効にする */
      border: 1px solid #ccc; /* 境界線を追加 */
    }
    .options {
      padding: 0.75em;
    }
    .info {
      float: right;
    }
    #connect {
      margin-right: 2em;
    }
    /* ターミナルのスクロールバーを太く見せるカスタムスタイル
       - WebKit (Chromium, Safari): 幅を px 指定
       - Firefox: scrollbar-width と scrollbar-color で見た目を調整
       - xterm の内部ビューポートにも適用 */
    #terminal,
    .xterm .xterm-viewport {
      scrollbar-width: auto; /* Firefox: autoにして太さはブラウザ基準に任せる */
      scrollbar-color: #888 #f1f1f1; /* thumb color / track color */
    }
    #terminal::-webkit-scrollbar,
    .xterm .xterm-viewport::-webkit-scrollbar {
      width: 12px; /* 太さを指定 */
    }
    #terminal::-webkit-scrollbar-thumb,
    .xterm .xterm-viewport::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 6px;
      border: 3px solid #f1f1f1; /* トラックとの間に余白を作る見た目 */
    }
    #terminal::-webkit-scrollbar-track,
    .xterm .xterm-viewport::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    label.checkbox {
      margin-right: 1em;
    }
    .button-default {
      background-color: blue; /* ボタンの背景色 */
      color: white;             /* テキストの色 */
    }
    /* 有効状態 (disabled がない場合) */
    .button-run:not(:disabled) {
      background-color: green; /* 有効時の背景色 */
      color: white; /* 有効時の文字色 */
      cursor: pointer; /* 有効時のカーソル */
    }
    /* 無効状態 (disabled がある場合) */
    .button-run:disabled {
      background-color: #ccc; /* 無効時の背景色 */
      color: #666; /* 無効時の文字色 */
      cursor: not-allowed; /* 無効時のカーソル */
    }
    /* 有効状態 (disabled がない場合) */
    .button-stop:not(:disabled) {
      background-color: red; /* 有効時の背景色 */
      color: white; /* 有効時の文字色 */
      cursor: pointer; /* 有効時のカーソル */
    }
    /* 無効状態 (disabled がある場合) */
    .button-stop:disabled {
      background-color: #ccc; /* 無効時の背景色 */
      color: #666; /* 無効時の文字色 */
      cursor: not-allowed; /* 無効時のカーソル */
    }
  </style>
  <style>
.top-bar {
  display: flex;
  gap: 16px;
  align-items: center;
  padding: 0.5em 1em;
}
.top-bar > div {
  display: flex;
  align-items: center;
  gap: 8px;
}
/* 横並び用のラッパーを追加 */
#main-panel {
  display: flex;
  gap: 16px; /* パネル間の余白 */
  align-items: flex-start;
}

/* file-panel の幅と高さ + 余白調整 */
    #file-panel {
      width: 200px; /* 必要に応じて調整 */
      min-width: 100px;
      flex-shrink: 0;
      height: calc(14 * 1.8em);
      overflow-y: auto;
      border: 1px solid var(--sl-color-neutral-300);
      border-radius: var(--sl-border-radius-medium);
      padding: 2px;
      box-sizing: border-box;
    }

/* editor の幅を調整 */
    #editor-panel {
      flex: 1;
      width: 100%;
      /* 下を約1行分（おおよそタブバーの高さ 1.2em）短くする */
      height: calc(400px - 1.2em);
    }
#tab-bar {
  height: 1.2em;
  background: #eee;
  border-bottom: 1px solid #ccc;
  display: flex;
  align-items: flex-end;
  padding-left: 8px;
  gap: 4px;
}

.tab {
  padding: 0.2em 0.2em;
  background: #ddd;
  border: 1px solid #bbb;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  margin-bottom: -1px;
  cursor: pointer;
  font-size: 0.8em;
  color: #333;
  transition: background 0.2s;
}

.tab.active {
  background: #fff;
  color: #222;
  border-bottom: 2px solid #4CAF50;
  font-weight: bold;
  z-index: 1;
}
    #editor {
      /* 右側を約1文字分だけ狭める（1ch = 幅1文字分） */
      width: calc(100% - 1ch);
      height: 100%;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

  </style>
  <script type="module" crossorigin src="./assets/index.a0d4f888.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/monaco-editor.6e4fa376.js">
  <link rel="stylesheet" href="./assets/monaco-editor.44e2f341.css">
  <link rel="stylesheet" href="./assets/index.ff373be6.css">
<link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
<body>
  <div class="top-bar">
    <div class="options">

      <button id="connect" class="button-default">せつぞく</button>
    </div>
    <div>
      <button id="newFileButton" disabled>しんき</button>
      <button id="saveFileButton" disabled>かきこみ</button>
      <button id="refreshFileList" disabled>一覧更新</button>
    </div>
    <div class="options">
      <button id="runCodeButton" class="button-run" disabled>RUN</button>
      <button id="stopButton" class="button-stop" disabled>STOP</button>
    </div>
    <div class="info">
      <a href="https://github.com/webserialrepl/webserialrepl.github.io">GitHub</a>
    </div>
  </div>

  <div id="main-panel">
    <div id="file-panel">
      <sl-tree id="file-tree" selection="single">
        <sl-tree-item>デバイスに、せつぞく してください</sl-tree-item>
      </sl-tree>
    </div>
    <div id="editor-panel">
      <div id="tab-bar"></div>
      <div id="editor"></div>
    </div>
  </div>

  <div class="options">
    <button id="download">Download output</button>
    <button id="clear">Clear output</button>
    <div id="terminal"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.28.1/min/vs/loader.min.js"></script>
  
</body>
</html>
